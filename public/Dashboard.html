<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Fotos</title>

 <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="container">

    <div class="kpis">
        <div class="kpi">
        <p>Tipo de foto mais comum</p>
        <h2 id="kpi_tipo"></h2>
        </div>

        <div class="kpi">
        <p>Mês com mais uploads</p>
        <h2 id="kpi_mes"></h2>
        </div>

        <div class="kpi">
        <p>Emoção mais frequente</p>
        <h2 id="kpi_emocao"></h2>
        </div>
    </div>

    <div class="graficos">

        <div class="grafico">
        <h3>Tipo de foto (Semanal)</h3>
        <canvas id="graficoTipo"></canvas>
        </div>

        <div class="grafico">
        <h3>Uploads por mês</h3>
        <canvas id="graficoMes"></canvas>
        </div>

        <div class="grafico" style="grid-column: span 2;">
        <h3>Emoções mais frequentes</h3>
        <canvas id="graficoEmocao"></canvas>
        </div>

    </div>

    </div>

    <script>
    // DADOS MOCKADOS
    const dadosTipos = {
        labels: ["Amigos", "Família", "Viagens", "Animais", "Esportes", "Momentos"],
        valores: [12, 18, 25, 8, 10, 14]
    };

    const dadosMes = {
        labels: ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"],
        valores: [40, 15, 30, 22, 18, 25, 30, 22, 40, 12, 18, 50]
    };

    const dadosEmocao = {
        labels: ["Feliz", "Animado", "Tranquilo", "Triste", "Surpreso", "Chateado"],
        valores: [40, 15, 25, 9, 20, 3]
    };

    // KPI's
    function pegarMaior(labels, valores) {
        let maior = 0;
        let indice = 0;

        for (let i = 0; i < valores.length; i++) {
        if (valores[i] > maior) {
            maior = valores[i];
            indice = i;
        }
        }

        return labels[indice];
    }

    document.getElementById("kpi_tipo").innerText =
        pegarMaior(dadosTipos.labels, dadosTipos.valores);

    document.getElementById("kpi_mes").innerText =
        pegarMaior(dadosMes.labels, dadosMes.valores);

    document.getElementById("kpi_emocao").innerText =
        pegarMaior(dadosEmocao.labels, dadosEmocao.valores);


    // GRÁFICO 1 - Tipo de foto

    new Chart(document.getElementById("graficoTipo"), {
        type: "bar",
        data: {
        labels: dadosTipos.labels,
        datasets: [{
            label: "Quantidade",
            data: dadosTipos.valores
        }]
        }
    });

    
    // GRÁFICO 2 - Upload por mês
    new Chart(document.getElementById("graficoMes"), {
        type: "line",
        data: {
        labels: dadosMes.labels,
        datasets: [{
            label: "Uploads",
            data: dadosMes.valores,
            fill: false,
            tension: 0.3
        }]
        }
    });


    // GRÁFICO 3 - Emoções
    new Chart(document.getElementById("graficoEmocao"), {
        type: "pie",
        data: {
        labels: dadosEmocao.labels,
        datasets: [{
            data: dadosEmocao.valores
        }]
        }
    });

    </script>

</body>
</html>
