<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="validacoes.js"></script>
</head>
<body>

    <div class="menu">
        <div class="logo">
            <img src="assets/imgs/Logo.png" alt="Logo">
        </div>

        <div class="links">
            <a href="Home.html">Home</a>
            <a href="#sobre">Sobre nós</a>
            <a href="#galeria">Galeria</a>
            <a href="#">Dashboard</a>
            <a href="Login.html">Login</a>
            <a href="Cadastro.html">Cadastre-se</a>
        </div>
    </div>
    
    <div class="container-validacao">

        <div class="fundo-banner"></div>

        <div class="texto-lateral">
            <h1>Olá novamente!</h1>

            <p>
            Faça o seu login e volte a <br>
            contribuir com a nossa galeria.
            </p>

            <span>Ainda não tem conta? Faça o seu cadastro</span>

            <a href="Cadastro.html" class="botao-login-cadastro">Cadastre-se</a>
        </div>

        <div class="form">

            <div class="formulario">

                <input type="email" id="email" placeholder="Email:">
                <input type="password" id="senha" placeholder="Senha:">

                <button onclick="validarLogin()">Login</button>

            </div>

        </div>

    </div>

   
</body>
</html>
