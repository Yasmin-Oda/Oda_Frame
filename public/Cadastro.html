<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="validacoes.js"></script>
</head>
<body>

    <div class="menu">
        <div class="logo">
            <img src="assets/imgs/Logo.png" alt="Logo">
        </div>

        <div class="links">
            <a href="Home.html">Home</a>
            <a href="#sobre">Sobre nós</a>
            <a href="#galeria">Galeria</a>
            <a href="Dashboard.html">Dashboard</a>
            <a href="Login.html">Login</a>
            <a href="Cadastro.html">Cadastre-se</a>
        </div>
    </div>
    

   <div class="container-validacao-cad">
        <div class="fundo-banner"></div>
        
        <!-- TEXTO -->
        <div class="texto-lateral">
            <h1>Cadastre-se</h1>

            <p>
            E contribua com uploads <br>
            para nossa galeria de fotos!
            </p>

            <span class="texto-redirecionar">Já tem conta? Faça o seu login</span>

            <a href="#" class="botao-login-cadastro">Login</a>
        </div>

        <!-- LADO DIREITO -->
        <div class="form">

            <div class="formulario">

                <input type="text" id="nome" placeholder="Nome:">
                <input type="email" id="email" placeholder="Email:">
                <input type="text" id="cpf" placeholder="CPF: XXX.XXX.XXX-XX">
                <input type="password" id="senha" placeholder="Senha:">
                <input type="password" id="confirmar" placeholder="Confirmar Senha:" onkeyup="verificarSenha()">

                <button onclick="validarCadastro()">Cadastre-se</button>

            </div>

        </div>

    </div>

</body>
</html>
